apply plugin: 'com.android.application'

import groovy.json.JsonSlurper

// Single source of truth for the version is ../package.json.
// versionCode = major*10000 + minor*100 + patch (override with -PversionCode=N or VERSION_CODE).
def pkg = new JsonSlurper().parse(file('../../package.json'))
def semver = (pkg.version as String).split('-')[0].split('\\.')*.toInteger()
def computedVersionCode = semver[0] * 10000 + semver[1] * 100 + semver[2]
def appVersionCode = (project.findProperty('versionCode') ?: System.getenv('VERSION_CODE') ?: computedVersionCode).toString().toInteger()

// Release signing: android/keystore.properties (gitignored) or environment variables
// (ANDROID_KEYSTORE_FILE, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD).
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) keystorePropsFile.withInputStream { keystoreProps.load(it) }
def signingValue = { String prop, String env -> keystoreProps.getProperty(prop) ?: System.getenv(env) }
def releaseStoreFile = signingValue('storeFile', 'ANDROID_KEYSTORE_FILE')

android {
    namespace = "dev.recursiveai.aspectstudio"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "dev.recursiveai.aspectstudio"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName pkg.version as String
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (releaseStoreFile) {
                storeFile rootProject.file(releaseStoreFile)
                storePassword signingValue('storePassword', 'ANDROID_KEYSTORE_PASSWORD')
                keyAlias signingValue('keyAlias', 'ANDROID_KEY_ALIAS')
                keyPassword signingValue('keyPassword', 'ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            // Release builds are only signed when a keystore is configured; otherwise
            // Gradle produces an unsigned artifact (which Play and adb will reject).
            if (releaseStoreFile) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
